<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.25; }
      50% { opacity: 0.65; }
      100% { opacity: 0.25; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animated-bg-circle {
      animation: pulse 5s infinite ease-in-out;
    }
    .floating-icon {
      animation: float 4s infinite ease-in-out;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M0 30 H1200 M0 60 H1200 M0 90 H1200 M0 120 H1200 M0 150 H1200 M0 180 H1200 M0 210 H1200 M0 240 H1200 M0 270 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M60 0 V300 M120 0 V300 M180 0 V300 M240 0 V300 M300 0 V300 M360 0 V300 M420 0 V300 M480 0 V300 M540 0 V300 M600 0 V300 M660 0 V300 M720 0 V300 M780 0 V300 M840 0 V300 M900 0 V300 M960 0 V300 M1020 0 V300 M1080 0 V300 M1140 0 V300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="140" fill="#6366f1" class="animated-bg-circle" />
  <circle cx="1000" cy="100" r="120" fill="#a855f7" class="animated-bg-circle" />

  <!-- Decorative Accent Bar -->
  <rect x="0" y="292" width="1200" height="8" fill="url(#accent-grad)" />

  <!-- Shield / Gavel Icon Graphic (Left Side) -->
  <g class="floating-icon" transform="translate(100, 75)">
    <!-- Outer Shield Frame -->
    <path d="M 75 10 L 135 35 V 90 C 135 130 75 160 75 160 C 75 160 15 130 15 90 V 35 Z" fill="url(#shield-grad)" opacity="0.9" />
    <path d="M 75 20 L 125 42 V 88 C 125 122 75 148 75 148 C 75 148 25 122 25 88 V 42 Z" fill="#0f172a" />
    <!-- Scales of Justice / Lock Emblem -->
    <path d="M 75 45 V 105 M 50 65 H 100 M 50 65 L 35 95 H 65 Z M 100 65 L 85 95 H 115 Z" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(280, 110)">
    <!-- Main Title (Standard SVG text without raw emojis that can break renderers) -->
    <text class="title-text" font-size="42" x="0" y="0">Awesome Legal Hold Management</text>
    
    <!-- Subtitle -->
    <text class="subtitle-text" font-size="20" x="0" y="38">Enterprise LegalTech, eDiscovery Preservation &amp; Custodian Tracking Ecosystem</text>

    <!-- Tag Pills / Badges inside banner -->
    <g transform="translate(0, 65)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text class="badge-text" x="60" y="21" text-anchor="middle">Litigation</text>

      <!-- Pill 2 -->
      <rect x="132" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text class="badge-text" x="197" y="21" text-anchor="middle">eDiscovery</text>

      <!-- Pill 3 -->
      <rect x="274" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text class="badge-text" x="356" y="21" text-anchor="middle">Custodian Track</text>

      <!-- Pill 4 -->
      <rect x="451" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text class="badge-text" x="516" y="21" text-anchor="middle">FRCP 37(e)</text>
    </g>
  </g>

  <!-- Tech Dots Accent -->
  <g transform="translate(1040, 180)" opacity="0.6">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="20" cy="0" r="4" fill="#6366f1" />
    <circle cx="40" cy="0" r="4" fill="#a855f7" />
    <circle cx="0" cy="20" r="4" fill="#6366f1" />
    <circle cx="20" cy="20" r="4" fill="#a855f7" />
    <circle cx="40" cy="20" r="4" fill="#ec4899" />
  </g>
</svg>
